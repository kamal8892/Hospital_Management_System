version: '3.8'

services:
  web:
    build: .
    image: kamal8955/hospital-management-system:latest
    container_name: hms_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the default Redis URL so it connects to the Redis container below
      - REDIS_URL=redis://redis:6379/0
    # This allows the container to connect to the MySQL database on your Windows host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: hms_redis
    ports:
      - "6379:6379"
    restart: always

  celery:
    build: .
    container_name: hms_celery
    # Make sure this matches your project name (HMS)
    command: celery -A HMS worker -l info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    depends_on:
      - redis
