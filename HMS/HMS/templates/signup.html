<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hospital Signup</title>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem("access")) {
            window.location.href = "/dashboard/";
        }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 45px;
            border-radius: 24px;
            width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            margin: 40px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #004d40;
            font-weight: 700;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #00695c;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .input-group {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(0, 105, 92, 0.2);
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            font-size: 15px;
        }

        input:focus {
            border-color: #00897b;
            box-shadow: 0 0 0 4px rgba(0, 137, 123, 0.15);
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: linear-gradient(135deg, #00897b 0%, #00695c 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 105, 92, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 105, 92, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        #msg {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            font-weight: 600;
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
            color: #00695c;
        }

        .footer-link a {
            color: #00897b;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            color: #004d40;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <form id="signupForm">
            <div class="row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" name="First_name" placeholder="First Name" required>
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" name="Last_name" placeholder="Last Name" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>City</label>
                    <input type="text" name="city" placeholder="Your City">
                </div>
                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="Phone Number">
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a strong password" required>
            </div>

            <button type="submit">Sign Up</button>
        </form>

        <div style="margin: 20px 0; text-align: center;">
            <p style="color: #00695c; font-weight: 600; margin-bottom: 10px;">OR</p>
            
            <div id="g_id_onload"
                 data-client_id="{{ GOOGLE_OAUTH_CLIENT_ID }}"
                 data-context="signup"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signup_with"
                 data-size="large"
                 data-logo_alignment="left"
                 style="display: flex; justify-content: center;">
            </div>
        </div>

        <p id="msg"></p>

        <div class="footer-link">
            Already have an account? <a href="/LoginPage/">Log In</a>
        </div>

    </div>

    <script>
        async function handleGoogleCredentialResponse(response) {
            let id_token = response.credential;
            
            let res = await fetch("/auth/google/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_token: id_token, action: "signup" }),
            });

            let result = await res.json();

            if (res.status === 200) {
                localStorage.setItem("access", result.access);
                localStorage.setItem("refresh", result.refresh);
                localStorage.setItem("user", JSON.stringify(result.user));

                document.getElementById("msg").innerHTML = "Google Signup Successful!";
                document.getElementById("msg").style.color = "green";

                setTimeout(() => {
                    window.location.href = "/dashboard/";
                }, 1000);
            } else {
                document.getElementById("msg").innerHTML = result.error || "Google Signup Failed";
                document.getElementById("msg").style.color = "red";
            }
        }

        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            let formData = new FormData(this);
            let data = Object.fromEntries(formData);

            let response = await fetch("/signup/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            let result = await response.json();

            if (response.status === 201 || response.status === 200) {
                document.getElementById("msg").innerHTML = "Signup Successfully!";
                document.getElementById("msg").style.color = "green";

                setTimeout(() => {
                    window.location.href = "/LoginPage/"; // if you want redirect
                }, 1500);

            } else {
                document.getElementById("msg").innerHTML = result.error || result.msg || "Error creating account";
                document.getElementById("msg").style.color = "red";
            }
        });
    </script>

</body>

</html>
