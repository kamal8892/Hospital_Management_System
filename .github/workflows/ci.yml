name: Django CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kamal
          MYSQL_DATABASE: HMS
          MYSQL_USER: kamal
          MYSQL_PASSWORD: kamal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add host.docker.internal to hosts
      run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install system dependencies for mysqlclient
      run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd HMS
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        touch .env

        
    - name: Run Tests
      run: |
        cd HMS
        python manage.py test
        
  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: |
        cd HMS
        touch .env
        docker-compose build
