name: Django CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # If you need a database service, you can define it here. 
      # Since db.sqlite3 is used locally, we'll just use that for tests, but you can configure Postgres/MySQL if needed.
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd HMS
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Tests
      run: |
        cd HMS
        python manage.py test
        
  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: |
        cd HMS
        docker-compose build
